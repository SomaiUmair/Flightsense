<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlightSense</title>

  <!--
    FlightSense frontend — a deliberately minimal starting point.

    No framework, no build step: just open this file in a browser (or serve the
    folder) and it talks to the FastAPI backend over fetch(). The goal is a
    clean base a teammate can grow into React/Vue/whatever later.

    Everything lives in this one file on purpose:
      - styles          -> the <style> block below
      - API calls       -> the api.* helpers in <script>
      - UI wiring       -> the event handlers at the bottom of <script>
  -->

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a2233;
      --muted: #6b7280;
      --border: #e2e6ef;
      --accent: #2563eb;
      --book: #16a34a;   /* BOOK NOW */
      --wait: #d97706;   /* WAIT */
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1420; --card: #171d2b; --text: #e6e9f0; --muted: #9aa3b2;
        --border: #2a3346; --accent: #3b82f6;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    header h1 { margin: 0; font-size: 1.75rem; }
    header p { margin: .25rem 0 0; color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }

    form { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .field { display: flex; flex-direction: column; gap: .25rem; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: .8rem; color: var(--muted); }
    input {
      padding: .6rem .7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .actions { grid-column: 1 / -1; display: flex; gap: .5rem; flex-wrap: wrap; }
    button {
      padding: .6rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      font-size: .95rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; }
    button.ghost { background: transparent; color: var(--accent); }
    button:disabled { opacity: .5; cursor: default; }

    .hidden { display: none; }
    .muted { color: var(--muted); font-size: .85rem; }

    /* Recommendation badge */
    .badge {
      display: inline-block; padding: .3rem .75rem; border-radius: 999px;
      font-weight: 600; font-size: .9rem; color: #fff;
    }
    .badge.book { background: var(--book); }
    .badge.wait { background: var(--wait); }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1rem; }
    .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .75rem; }
    .stat .k { font-size: .75rem; color: var(--muted); }
    .stat .v { font-size: 1.15rem; font-weight: 600; }

    table { width: 100%; border-collapse: collapse; margin-top: .5rem; font-size: .9rem; }
    th, td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }

    .error { color: var(--error); }
    .settings { margin-top: 2rem; }
    .settings input { width: 100%; }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>✈️ FlightSense</h1>
      <p>Should you book that flight now, or wait for a better price?</p>
    </header>

    <!-- Search form -->
    <div class="card">
      <form id="search-form">
        <div class="field">
          <label for="origin">From (airport code)</label>
          <input id="origin" name="origin" placeholder="YYC" required maxlength="3" autocomplete="off" />
        </div>
        <div class="field">
          <label for="destination">To (airport code)</label>
          <input id="destination" name="destination" placeholder="LON" required maxlength="3" autocomplete="off" />
        </div>
        <div class="field full">
          <label for="departure_date">Departure date</label>
          <input id="departure_date" name="departure_date" type="date" required />
        </div>
        <div class="actions">
          <button type="submit" class="primary">Should I book?</button>
          <button type="button" id="history-btn" class="ghost">Show price history</button>
        </div>
      </form>
    </div>

    <!-- Results appear here -->
    <div id="status" class="card hidden"></div>

    <div id="recommendation" class="card hidden">
      <h2 style="margin-top:0">Recommendation</h2>
      <div id="rec-body"></div>
    </div>

    <div id="history" class="card hidden">
      <h2 style="margin-top:0">Price history</h2>
      <div id="history-body"></div>
    </div>

    <!-- API base URL: handy while the backend host isn't fixed yet -->
    <div class="settings">
      <label class="muted" for="api-base">Backend API URL</label>
      <input id="api-base" class="muted" value="http://localhost:8000" />
    </div>
  </div>

  <script>
    // ---- tiny helpers --------------------------------------------------------

    const $ = (id) => document.getElementById(id);

    // Where the FastAPI backend lives. Editable in the box at the bottom so a
    // teammate can point it at a deployed URL without touching code.
    const apiBase = () => $("api-base").value.replace(/\/$/, "");

    // All three endpoints take the departure date as a query parameter.
    function buildUrl(path, departureDate) {
      const q = new URLSearchParams({ departure_date: departureDate });
      return `${apiBase()}${path}?${q}`;
    }

    async function getJson(url) {
      const res = await fetch(url);
      if (!res.ok) {
        // FastAPI returns { "detail": "..." } on errors — surface that message.
        let detail = `${res.status} ${res.statusText}`;
        try { detail = (await res.json()).detail || detail; } catch { /* ignore */ }
        throw new Error(detail);
      }
      return res.json();
    }

    // Thin wrappers, one per backend endpoint.
    const api = {
      predict: (o, d, date) => getJson(buildUrl(`/predict/${o}/${d}`, date)),
      history: (o, d, date) => getJson(buildUrl(`/prices/${o}/${d}`, date)),
      // cheapest: (o, d, date) => getJson(buildUrl(`/prices/${o}/${d}/cheapest`, date)),
      //   ^ endpoint exists in the backend — wire up a button for it as an exercise.
    };

    const money = (n, ccy = "USD") =>
      new Intl.NumberFormat(undefined, { style: "currency", currency: ccy }).format(n);

    // ---- UI state ------------------------------------------------------------

    function showStatus(msg, isError = false) {
      const el = $("status");
      el.textContent = msg;
      el.classList.toggle("error", isError);
      el.classList.remove("hidden");
    }
    function hide(id) { $(id).classList.add("hidden"); }

    function readForm() {
      return {
        origin: $("origin").value.trim().toUpperCase(),
        destination: $("destination").value.trim().toUpperCase(),
        date: $("departure_date").value,
      };
    }

    // ---- render results ------------------------------------------------------

    function renderRecommendation(r) {
      const isBook = r.recommendation === "BOOK NOW";
      $("rec-body").innerHTML = `
        <p>
          <span class="badge ${isBook ? "book" : "wait"}">${r.recommendation}</span>
          <span class="muted"> for ${r.route} on ${r.departure_date}</span>
        </p>
        <div class="stat-grid">
          <div class="stat"><div class="k">Predicted price today</div>
            <div class="v">${money(r.predicted_price_today)}</div></div>
          <div class="stat"><div class="k">Cheapest predicted</div>
            <div class="v">${money(r.cheapest_predicted_price)}</div></div>
          <div class="stat"><div class="k">Best day to book</div>
            <div class="v">${r.best_day_to_book}</div></div>
        </div>`;
      $("recommendation").classList.remove("hidden");
    }

    function renderHistory(rows) {
      if (!rows.length) {
        $("history-body").innerHTML = `<p class="muted">No prices recorded for that flight yet.</p>`;
      } else {
        const trs = rows.map((p) => `
          <tr>
            <td>${new Date(p.observed_at).toLocaleDateString()}</td>
            <td>${money(p.price, p.currency)}</td>
          </tr>`).join("");
        $("history-body").innerHTML = `
          <table>
            <thead><tr><th>Observed</th><th>Price</th></tr></thead>
            <tbody>${trs}</tbody>
          </table>`;
      }
      $("history").classList.remove("hidden");
    }

    // ---- event wiring --------------------------------------------------------

    $("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { origin, destination, date } = readForm();
      hide("recommendation"); hide("history");
      showStatus("Asking the model…");
      try {
        renderRecommendation(await api.predict(origin, destination, date));
        hide("status");
      } catch (err) {
        showStatus(`Could not get a recommendation: ${err.message}`, true);
      }
    });

    $("history-btn").addEventListener("click", async () => {
      const { origin, destination, date } = readForm();
      if (!origin || !destination || !date) {
        showStatus("Fill in origin, destination, and date first.", true);
        return;
      }
      hide("recommendation"); hide("history");
      showStatus("Loading price history…");
      try {
        renderHistory(await api.history(origin, destination, date));
        hide("status");
      } catch (err) {
        showStatus(`Could not load history: ${err.message}`, true);
      }
    });
  </script>
</body>
</html>
